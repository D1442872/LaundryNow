{% extends "base.html" %}

{% block title %}編輯洗衣機｜LaundryNow{% endblock %}

{% block content %}
<section class="form-page">
    <div class="form-card">
        <h1>編輯洗衣機資料</h1>
        <p>修改洗衣機編號、位置、狀態與剩餘時間。</p>

        <form action="{{ url_for('edit_machine', machine_id=machine.id) }}" method="POST" class="main-form">
            <label for="machine_number">洗衣機編號</label>
            <input
                type="text"
                id="machine_number"
                name="machine_number"
                value="{{ form.machine_number }}"
                required
            >

            <label for="location">位置</label>
            <input
                type="text"
                id="location"
                name="location"
                value="{{ form.location }}"
                required
            >

            <label for="status">狀態</label>
            <select id="status" name="status" class="status-select">
                {% for status in valid_statuses %}
                    <option value="{{ status }}" {% if form.status == status %}selected{% endif %}>{{ status }}</option>
                {% endfor %}
            </select>

            <label for="remaining_time">剩餘時間（分鐘）</label>
            <input
                type="number"
                id="remaining_time"
                name="remaining_time"
                min="0"
                value="{{ form.remaining_time }}"
                class="remaining-input"
            >

            <div class="form-actions">
                <button type="submit" class="button">儲存修改</button>
                <a href="{{ url_for('index') }}" class="button secondary">返回首頁</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}新增洗衣機｜LaundryNow{% endblock %}

{% block content %}
<section class="form-page">
    <div class="form-card">
        <h1>新增洗衣機資料</h1>
        <p>請輸入洗衣機編號、位置、初始狀態與剩餘時間。</p>

        <form action="{{ url_for('add_machine') }}" method="POST" class="main-form">
            <label for="machine_number">洗衣機編號</label>
            <input
                type="text"
                id="machine_number"
                name="machine_number"
                placeholder="例如 A01"
                value="{{ form.machine_number if form.machine_number else '' }}"
                required
            >

            <label for="location">位置</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="例如 福星宿舍 1 樓洗衣間"
                value="{{ form.location if form.location else '' }}"
                required
            >

            <label for="status">初始狀態</label>
            <select id="status" name="status" class="status-select">
                {% for status in valid_statuses %}
                    <option value="{{ status }}" {% if form.status == status %}selected{% endif %}>{{ status }}</option>
                {% endfor %}
            </select>

            <label for="remaining_time">剩餘時間（分鐘）</label>
            <input
                type="number"
                id="remaining_time"
                name="remaining_time"
                min="0"
                value="{{ form.remaining_time if form.remaining_time else 0 }}"
                class="remaining-input"
            >

            <div class="form-actions">
                <button type="submit" class="button">新增</button>
                <a href="{{ url_for('index') }}" class="button secondary">返回首頁</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
